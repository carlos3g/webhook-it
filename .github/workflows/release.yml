name: Release

# Publishes @carlos3g/webhook-it to npm when a GitHub Release is published.
#
# Uses npm Trusted Publishing (OIDC) — no NPM_TOKEN secret. One-time setup on
# npmjs.com: the package → Settings → Trusted Publishers → add a GitHub Actions
# publisher with repository `carlos3g/webhook-it` and workflow `release.yml`.
# The version published is whatever is in apps/cli/package.json, so bump it
# before tagging the release.

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for Trusted Publishing + provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      # Node 24 ships npm 11, required for Trusted Publishing (npm >= 11.5.1).
      # Node 22 ships npm 10, and self-upgrading npm 10 on hosted runners is
      # unreliable — so install Node 24 directly.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build npm bundle
        run: bun run build:npm

      - name: Publish to npm
        run: npm publish --access public --provenance
        working-directory: apps/cli
